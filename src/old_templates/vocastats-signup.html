<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocaStats · 회원가입</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --purple:      #5c3fa4;
  --purple-h:    #4a3190;
  --purple-ring: rgba(92,63,164,.18);
  --green:       #3bbf82;
  --green-ring:  rgba(59,191,130,.18);
  --dark-bg:     #0e0d1c;
  --light-bg:    #f3f2f8;
  --text:        #18172e;
  --muted:       #7c7a90;
  --border:      #d8d6e5;
  --white:       #ffffff;
  --danger:      #e0415a;
  --danger-ring: rgba(224,65,90,.15);
}

html, body { height:100%; background:var(--light-bg); font-family:'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; }

.page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }

.card {
  display:grid; grid-template-columns:1fr 1.15fr;
  width:100%; max-width:820px;
  border-radius:20px; overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.14);
  animation:rise .55s cubic-bezier(.22,.68,0,1.2) both;
}
@keyframes rise { from{opacity:0;transform:translateY(28px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

/* ── LEFT ── */
.left {
  background:var(--dark-bg);
  padding:52px 42px;
  display:flex; flex-direction:column; justify-content:center;
  position:relative; overflow:hidden;
}
.left::before { content:''; position:absolute; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(80,50,160,.55) 0%,transparent 68%); top:-70px; right:-55px; pointer-events:none; }
.left::after  { content:''; position:absolute; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,rgba(50,160,120,.22) 0%,transparent 68%); bottom:30px; right:10px; pointer-events:none; }

.logo { display:flex; gap:0; margin-bottom:10px; position:relative; z-index:1; animation:fadeUp .45s .05s ease both; }
.logo-part { font-family:'DM Mono',monospace; font-weight:500; font-size:16px; letter-spacing:1.5px; padding:6px 16px; line-height:1; }
.logo-voca  { background:var(--purple); color:#fff; border-radius:7px 0 0 7px; }
.logo-stats { background:var(--green);  color:#fff; border-radius:0 7px 7px 0; }

.logo-sub { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:3.5px; color:#4e4d68; margin-bottom:34px; position:relative; z-index:1; animation:fadeUp .45s .09s ease both; }

.headline { font-size:24px; font-weight:900; line-height:1.4; color:#fff; margin-bottom:10px; position:relative; z-index:1; word-break:keep-all; animation:fadeUp .45s .13s ease both; }
.subtext  { font-size:13px; color:#5e5d7a; margin-bottom:36px; position:relative; z-index:1; animation:fadeUp .45s .17s ease both; }

.steps { list-style:none; display:flex; flex-direction:column; gap:0; position:relative; z-index:1; animation:fadeUp .45s .21s ease both; }
.step { display:flex; align-items:flex-start; gap:14px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.05); }
.step:last-child { border-bottom:none; }
.step-num {
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'DM Mono',monospace; font-size:11px; font-weight:500;
  flex-shrink:0; margin-top:1px;
}
.step-num.done   { background:var(--green); color:#fff; }
.step-num.active { background:var(--purple); color:#fff; box-shadow:0 0 0 3px rgba(92,63,164,.35); }
.step-num.idle   { background:rgba(255,255,255,.08); color:#5e5d7a; }
.step-info { display:flex; flex-direction:column; gap:3px; }
.step-title { font-size:13px; font-weight:700; color:#fff; }
.step-title.idle { color:#5e5d7a; }
.step-desc  { font-size:12px; color:#4e4d68; }

/* ── RIGHT ── */
.right { background:var(--light-bg); padding:44px 46px; display:flex; flex-direction:column; justify-content:center; }

.form-title   { font-size:24px; font-weight:900; color:var(--text); margin-bottom:4px; animation:fadeUp .45s .08s ease both; }
.login-hint   { font-size:13px; color:var(--muted); margin-bottom:26px; animation:fadeUp .45s .12s ease both; }
.login-hint a { color:var(--purple); font-weight:700; text-decoration:none; }
.login-hint a:hover { text-decoration:underline; }

/* step panels */
.step-panel { display:none; flex-direction:column; gap:0; }
.step-panel.active { display:flex; animation:fadeUp .35s ease both; }

/* field */
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:500; color:var(--text); margin-bottom:6px; }
.field-row { display:flex; gap:8px; }
.field input {
  width:100%; padding:12px 15px;
  border:1.8px solid var(--border); border-radius:10px;
  font-size:14px; font-family:'Noto Sans KR',sans-serif;
  color:var(--text); background:var(--white); outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.field input::placeholder { color:#c0becc; }
.field input:focus { border-color:var(--purple); box-shadow:0 0 0 4px var(--purple-ring); }
.field input.error { border-color:var(--danger); box-shadow:0 0 0 4px var(--danger-ring); }
.field input.success { border-color:var(--green); box-shadow:0 0 0 4px var(--green-ring); }
.field-msg { font-size:12px; margin-top:5px; padding-left:2px; min-height:16px; }
.field-msg.err { color:var(--danger); }
.field-msg.ok  { color:var(--green);  }

/* send-code btn */
.btn-send {
  flex-shrink:0; padding:0 16px; height:46px;
  background:var(--purple); color:#fff;
  font-size:13px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
  border:none; border-radius:10px; cursor:pointer; white-space:nowrap;
  transition:background .2s, opacity .2s;
}
.btn-send:hover { background:var(--purple-h); }
.btn-send:disabled { opacity:.5; cursor:default; }

/* countdown */
.countdown { font-family:'DM Mono',monospace; font-size:12px; color:var(--purple); font-weight:500; }

/* pw strength */
.strength-bar { display:flex; gap:4px; margin-top:8px; }
.strength-seg { flex:1; height:4px; border-radius:2px; background:var(--border); transition:background .3s; }
.strength-label { font-size:11px; margin-top:4px; color:var(--muted); }

/* pw toggle */
.pw-wrap { position:relative; }
.pw-wrap input { padding-right:42px; }
.pw-eye {
  position:absolute; right:13px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; padding:0;
  color:var(--muted); line-height:1; font-size:16px;
  transition:color .2s;
}
.pw-eye:hover { color:var(--text); }

/* primary btn */
.btn-primary {
  width:100%; margin-top:18px; padding:14px;
  background:var(--purple); color:#fff;
  font-size:15px; font-weight:700; font-family:'Noto Sans KR',sans-serif;
  border:none; border-radius:10px; cursor:pointer; letter-spacing:.5px;
  transition:background .2s, transform .1s, box-shadow .2s;
  position:relative; overflow:hidden;
}
.btn-primary::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 60%); pointer-events:none; }
.btn-primary:hover  { background:var(--purple-h); box-shadow:0 6px 20px rgba(92,63,164,.35); }
.btn-primary:active { transform:scale(.98); }
.btn-primary.loading { pointer-events:none; }
.btn-primary.loading .btn-text { opacity:0; }
.btn-primary .spinner {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:20px; height:20px;
  border:2.5px solid rgba(255,255,255,.3); border-top-color:#fff;
  border-radius:50%; opacity:0; transition:opacity .15s;
}
.btn-primary.loading .spinner { opacity:1; animation:spin .7s linear infinite; }

/* verify code inputs */
.code-inputs { display:flex; gap:10px; justify-content:center; margin:20px 0 6px; }
.code-inputs input {
  width:48px; height:56px; text-align:center;
  font-size:22px; font-family:'DM Mono',monospace; font-weight:500;
  border:1.8px solid var(--border); border-radius:12px;
  color:var(--text); background:var(--white); outline:none;
  transition:border-color .2s, box-shadow .2s;
  caret-color:var(--purple);
}
.code-inputs input:focus { border-color:var(--purple); box-shadow:0 0 0 4px var(--purple-ring); }
.code-inputs input.filled { border-color:var(--purple); background:#f8f6ff; }
.code-inputs input.error  { border-color:var(--danger); box-shadow:0 0 0 4px var(--danger-ring); background:#fff6f7; }

.code-sub { font-size:13px; color:var(--muted); text-align:center; margin-bottom:4px; }
.resend-row { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }
.resend-row button { background:none; border:none; cursor:pointer; color:var(--purple); font-size:12px; font-weight:700; font-family:'Noto Sans KR',sans-serif; }
.resend-row button:disabled { color:var(--muted); cursor:default; }

/* success screen */
.success-screen { text-align:center; padding:16px 0; animation:fadeUp .4s ease both; }
.success-icon { font-size:52px; margin-bottom:16px; }
.success-title { font-size:22px; font-weight:900; color:var(--text); margin-bottom:8px; }
.success-desc  { font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:28px; }

/* progress dots */
.progress { display:flex; gap:6px; justify-content:center; margin-bottom:24px; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:background .3s, transform .3s; }
.dot.active { background:var(--purple); transform:scale(1.25); }
.dot.done   { background:var(--green); }

@keyframes spin    { to{transform:translate(-50%,-50%) rotate(360deg)} }
@keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes shake   { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
@keyframes pop     { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }

@media (max-width:620px) {
  .card { grid-template-columns:1fr; }
  .left { display:none; }
  .right { padding:44px 28px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="card">

    <!-- ── LEFT ── -->
    <div class="left">
      <div class="logo">
        <span class="logo-part logo-voca">VOCA</span>
        <span class="logo-part logo-stats">STATS</span>
      </div>
      <p class="logo-sub">VOCABULARY · STATISTICS</p>
      <h1 class="headline">지금 시작하면<br>내일의 어휘가<br>달라집니다</h1>
      <p class="subtext">3단계로 간편하게 가입하세요.</p>

      <ul class="steps" id="sideSteps">
        <li class="step">
          <div class="step-num active" id="sn1">1</div>
          <div class="step-info">
            <span class="step-title" id="st1">기본 정보 입력</span>
            <span class="step-desc">닉네임 · 이메일 · 비밀번호</span>
          </div>
        </li>
        <li class="step">
          <div class="step-num idle" id="sn2">2</div>
          <div class="step-info">
            <span class="step-title idle" id="st2">이메일 인증</span>
            <span class="step-desc">6자리 코드 확인</span>
          </div>
        </li>
        <li class="step">
          <div class="step-num idle" id="sn3">3</div>
          <div class="step-info">
            <span class="step-title idle" id="st3">가입 완료</span>
            <span class="step-desc">VocaStats 시작하기</span>
          </div>
        </li>
      </ul>
    </div>

    <!-- ── RIGHT ── -->
    <div class="right">
      <h2 class="form-title" id="formTitle">회원가입</h2>
      <p class="login-hint" id="loginHint">이미 계정이 있으신가요? <a href="vocastats-login.html">로그인</a></p>

      <!-- progress dots -->
      <div class="progress">
        <div class="dot active" id="dot1"></div>
        <div class="dot"        id="dot2"></div>
        <div class="dot"        id="dot3"></div>
      </div>

      <!-- ── STEP 1: 기본 정보 ── -->
      <div class="step-panel active" id="panel1">

        <div class="field">
          <label for="nickname">닉네임</label>
          <input id="nickname" type="text" placeholder="사용할 닉네임을 입력하세요" maxlength="20" oninput="validateNickname()">
          <div class="field-msg" id="msg-nickname"></div>
        </div>

        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="example@email.com" oninput="validateEmail()">
          <div class="field-msg" id="msg-email"></div>
        </div>

        <div class="field">
          <label for="pw">비밀번호</label>
          <div class="pw-wrap">
            <input id="pw" type="password" placeholder="8자 이상, 영문·숫자 포함" oninput="checkStrength()">
            <button class="pw-eye" onclick="togglePw('pw',this)" type="button">👁</button>
          </div>
          <div class="strength-bar" id="strengthBar">
            <div class="strength-seg" id="seg1"></div>
            <div class="strength-seg" id="seg2"></div>
            <div class="strength-seg" id="seg3"></div>
            <div class="strength-seg" id="seg4"></div>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="field">
          <label for="pwc">비밀번호 확인</label>
          <div class="pw-wrap">
            <input id="pwc" type="password" placeholder="비밀번호를 다시 입력하세요" oninput="validatePwc()">
            <button class="pw-eye" onclick="togglePw('pwc',this)" type="button">👁</button>
          </div>
          <div class="field-msg" id="msg-pwc"></div>
        </div>

        <button class="btn-primary" onclick="goStep2()">
          <span class="btn-text">다음 단계</span>
          <span class="spinner"></span>
        </button>
      </div>

      <!-- ── STEP 2: 이메일 인증 ── -->
      <div class="step-panel" id="panel2">
        <p class="code-sub">
          <strong id="codeEmailLabel"></strong>으로 전송된<br>
          6자리 인증코드를 입력해 주세요.
        </p>
        <div class="code-inputs" id="codeInputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
        <div class="field-msg" id="msg-code" style="text-align:center;margin-bottom:2px"></div>
        <div class="resend-row">
          남은 시간 <span class="countdown" id="countdown">03:00</span> ·
          <button id="btnResend" onclick="resendCode()" disabled>재발송</button>
        </div>

        <button class="btn-primary" onclick="verifyCode()">
          <span class="btn-text">인증 확인</span>
          <span class="spinner"></span>
        </button>
      </div>

      <!-- ── STEP 3: 완료 ── -->
      <div class="step-panel" id="panel3">
        <div class="success-screen">
          <div class="success-icon" id="successIcon">🎉</div>
          <div class="success-title">가입이 완료됐어요!</div>
          <div class="success-desc">VocaStats와 함께<br>영어 어휘 실력을 키워보세요.</div>
          <button class="btn-primary" style="margin-top:0" onclick="goLogin()">
            <span class="btn-text">로그인하러 가기</span>
            <span class="spinner"></span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ── state ──
let currentStep = 1;
let timer = null;
let remaining = 180;
const DEMO_CODE = '482719'; // 데모용 고정 코드

// ── step navigation ──
function setStep(n) {
  document.getElementById(`panel${currentStep}`).classList.remove('active');
  currentStep = n;
  document.getElementById(`panel${n}`).classList.add('active');

  // dots
  for (let i = 1; i <= 3; i++) {
    const d = document.getElementById(`dot${i}`);
    d.className = 'dot' + (i < n ? ' done' : i === n ? ' active' : '');
  }

  // side steps
  for (let i = 1; i <= 3; i++) {
    const sn = document.getElementById(`sn${i}`);
    const st = document.getElementById(`st${i}`);
    if (i < n)      { sn.className='step-num done';   sn.textContent='✓'; st.className='step-title'; }
    else if (i===n) { sn.className='step-num active'; sn.textContent=i;   st.className='step-title'; }
    else            { sn.className='step-num idle';   sn.textContent=i;   st.className='step-title idle'; }
  }

  if (n === 2) {
    document.getElementById('formTitle').textContent = '이메일 인증';
    document.getElementById('loginHint').style.opacity = '0';
    document.getElementById('codeEmailLabel').textContent = document.getElementById('email').value;
    sendCode();
    startTimer();
    focusFirst();
  }
  if (n === 3) {
    clearInterval(timer);
    document.getElementById('formTitle').textContent = '가입 완료';
    document.getElementById('loginHint').style.opacity = '0';
    document.getElementById('successIcon').style.animation = 'pop .4s ease';
  }
}

// ── step 1 validation & proceed ──
function goStep2() {
  const nick  = document.getElementById('nickname').value.trim();
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('pw').value;
  const pwc   = document.getElementById('pwc').value;

  let ok = true;
  if (!nick || nick.length < 2) {
    setMsg('nickname','닉네임은 2자 이상 입력해 주세요.','err');
    shake(document.getElementById('nickname')); ok = false;
  }
  if (!isValidEmail(email)) {
    setMsg('email','올바른 이메일 형식을 입력해 주세요.','err');
    shake(document.getElementById('email')); ok = false;
  }
  if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) {
    shake(document.getElementById('pw'));
    document.getElementById('strengthLabel').style.color = 'var(--danger)';
    ok = false;
  }
  if (pw !== pwc) {
    setMsg('pwc','비밀번호가 일치하지 않습니다.','err');
    shake(document.getElementById('pwc')); ok = false;
  }
  if (!ok) return;

  // 버튼 로딩 상태 → 코드 발송 → step 2 이동
  const btn = document.querySelector('#panel1 .btn-primary');
  btn.classList.add('loading');
  setTimeout(() => {
    btn.classList.remove('loading');
    setStep(2);
  }, 900);
}

// ── email code send (step 2 진입 시 자동 호출) ──
function sendCode() {
  const email = document.getElementById('email').value.trim();
  document.getElementById('codeEmailLabel').textContent = email;
  showToast(`${email}로 코드가 발송됐어요. (데모: ${DEMO_CODE})`);
}

function resendCode() {
  clearInterval(timer);
  remaining = 180;
  document.getElementById('btnResend').disabled = true;
  setMsg('code','','');
  resetCodeInputs();
  setTimeout(() => { sendCode(); startTimer(); }, 600);
}

// ── code verify ──
function verifyCode() {
  const inputs = document.querySelectorAll('#codeInputs input');
  const code = [...inputs].map(i => i.value).join('');
  if (code.length < 6) { setMsg('code','6자리를 모두 입력해 주세요.','err'); shakeCode(); return; }
  if (code !== DEMO_CODE) { setMsg('code','인증코드가 올바르지 않습니다.','err'); shakeCode(); return; }
  setStep(3);
}

// ── timer ──
function startTimer() {
  remaining = 180;
  updateCountdown();
  timer = setInterval(() => {
    remaining--;
    updateCountdown();
    if (remaining <= 0) {
      clearInterval(timer);
      document.getElementById('btnResend').disabled = false;
      setMsg('code','인증 시간이 만료됐어요. 재발송해 주세요.','err');
    }
  }, 1000);
}
function updateCountdown() {
  const m = String(Math.floor(remaining/60)).padStart(2,'0');
  const s = String(remaining%60).padStart(2,'0');
  document.getElementById('countdown').textContent = `${m}:${s}`;
}

// ── code input UX ──
document.addEventListener('DOMContentLoaded', () => {
  const inputs = document.querySelectorAll('#codeInputs input');
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/,'');
      if (inp.value) { inp.classList.add('filled'); if (i < 5) inputs[i+1].focus(); }
      else inp.classList.remove('filled');
      setMsg('code','','');
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i-1].focus(); inputs[i-1].value=''; inputs[i-1].classList.remove('filled'); }
    });
    inp.addEventListener('paste', e => {
      e.preventDefault();
      const paste = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      [...paste].forEach((ch, j) => { if (inputs[i+j]) { inputs[i+j].value=ch; inputs[i+j].classList.add('filled'); } });
      const next = inputs[Math.min(i+paste.length, 5)]; if(next) next.focus();
    });
  });
});
function focusFirst() { setTimeout(() => document.querySelector('#codeInputs input').focus(), 300); }
function resetCodeInputs() { document.querySelectorAll('#codeInputs input').forEach(i => { i.value=''; i.className=''; }); }
function shakeCode() { document.querySelectorAll('#codeInputs input').forEach(i => { i.classList.add('error'); i.style.animation='none'; i.offsetHeight; i.style.animation='shake .35s ease'; }); }

// ── pw strength ──
function checkStrength() {
  const pw = document.getElementById('pw').value;
  let score = 0;
  if (pw.length >= 8)             score++;
  if (/[a-zA-Z]/.test(pw))        score++;
  if (/[0-9]/.test(pw))           score++;
  if (/[^a-zA-Z0-9]/.test(pw))    score++;
  const colors = ['','#e0415a','#f5a623','#5c3fa4','#3bbf82'];
  const labels = ['','취약','보통','강함','매우 강함'];
  for (let i=1;i<=4;i++) {
    document.getElementById(`seg${i}`).style.background = i<=score ? colors[score] : 'var(--border)';
  }
  const lbl = document.getElementById('strengthLabel');
  lbl.textContent = pw.length ? `비밀번호 강도: ${labels[score]}` : '';
  lbl.style.color = colors[score];
  validatePwc();
}
function validatePwc() {
  const pw=document.getElementById('pw').value, pwc=document.getElementById('pwc').value;
  if (!pwc) { setMsg('pwc','',''); return; }
  if (pw===pwc) setMsg('pwc','비밀번호가 일치합니다.','ok');
  else          setMsg('pwc','비밀번호가 일치하지 않습니다.','err');
}
function validateNickname() {
  const v = document.getElementById('nickname').value.trim();
  if (!v) { setMsg('nickname','',''); return; }
  if (v.length < 2) setMsg('nickname','2자 이상 입력해 주세요.','err');
  else              setMsg('nickname','사용 가능한 닉네임이에요.','ok');
}
function validateEmail() {
  const v = document.getElementById('email').value.trim();
  if (!v) { setMsg('email','',''); return; }
  if (!isValidEmail(v)) setMsg('email','올바른 이메일 형식을 입력해 주세요.','err');
  else                  setMsg('email','','');
}

// ── utils ──
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function setMsg(id, txt, type) {
  const el = document.getElementById(`msg-${id}`);
  el.textContent = txt;
  el.className = 'field-msg' + (type ? ` ${type}` : '');
}
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.textContent = inp.type==='password' ? '👁' : '🙈';
}
function shake(el) { el.style.animation='none'; el.offsetHeight; el.style.animation='shake .35s ease'; el.focus(); }
function goLogin() { showToast('로그인 페이지로 이동합니다…'); }

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', bottom:'28px', left:'50%', transform:'translateX(-50%) translateY(12px)',
    background:'#18172e', color:'#fff', padding:'11px 22px', borderRadius:'10px',
    fontSize:'14px', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:'500',
    opacity:'0', transition:'opacity .25s, transform .25s', zIndex:'9999',
    boxShadow:'0 8px 24px rgba(0,0,0,.22)', whiteSpace:'nowrap'
  });
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(8px)'; setTimeout(()=>t.remove(),300); }, 2400);
}
</script>
