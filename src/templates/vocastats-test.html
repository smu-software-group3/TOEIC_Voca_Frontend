<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocaStats — 테스트</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', sans-serif;
  background: linear-gradient(145deg, #e8e4ff 0%, #d4e8ff 30%, #c8f5f0 65%, #e4e0ff 100%);
  min-height: 100vh; display: flex;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle at 85% 10%, rgba(167,139,250,0.32) 0%, transparent 35%),
    radial-gradient(circle at 10% 85%, rgba(45,212,191,0.22) 0%, transparent 35%),
    radial-gradient(circle at 60% 50%, rgba(196,181,253,0.1) 0%, transparent 40%);
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(2px 2px at 18% 7%, rgba(124,58,237,0.5), transparent),
    radial-gradient(3px 3px at 72% 14%, rgba(13,148,136,0.45), transparent),
    radial-gradient(2px 2px at 88% 28%, rgba(109,40,217,0.45), transparent),
    radial-gradient(2px 2px at 22% 73%, rgba(13,148,136,0.4), transparent),
    radial-gradient(3px 3px at 82% 82%, rgba(124,58,237,0.45), transparent);
}
.sidebar {
  width: 158px; flex-shrink: 0;
  background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
  padding: 20px 12px; display: flex; flex-direction: column; gap: 2px;
  min-height: 100vh; position: fixed; top: 0; left: 0; bottom: 0;
  border-right: 0.5px solid rgba(139,92,246,0.15); z-index: 10;
}
.sb-logo { display: flex; align-items: center; gap: 9px; margin-bottom: 24px; padding: 0 4px; }
.sb-logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #7c3aed, #0d9488);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(124,58,237,0.4); flex-shrink: 0;
}
.sb-sec { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; padding: 10px 8px 3px; color: #a78bfa; }
.sb-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 8px; font-size: 12px; color: #64748b;
  text-decoration: none; transition: all 0.15s;
}
.sb-item:hover { background: rgba(139,92,246,0.12); color: #a78bfa; }
.sb-item.active { background: rgba(139,92,246,0.22); color: #c4b5fd; font-weight: 600; }
.sb-bottom { margin-top: auto; padding-top: 16px; border-top: 0.5px solid rgba(139,92,246,0.12); }
.sb-avatar { display: flex; align-items: center; gap: 8px; padding: 4px 6px; text-decoration: none; }
.sb-avatar-img {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #0d9488);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.main {
  margin-left: 158px; flex: 1; padding: 30px 32px;
  position: relative; z-index: 1; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #7c3aed; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
h1 { font-size: 26px; font-weight: 700; color: #1e1b4b; margin-bottom: 8px; text-align: center; }
.sub { font-size: 14px; color: #7c6fad; margin-bottom: 42px; text-align: center; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 560px; margin-bottom: 28px; }
.type-card {
  background: rgba(255,255,255,0.72);
  border-radius: 20px; padding: 30px 24px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform 0.18s, box-shadow 0.18s;
  text-decoration: none; display: block;
}
.type-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(109,40,217,0.18); }
.type-card.purple { border: 1.5px solid rgba(139,92,246,0.3); }
.type-card.teal { border: 1.5px solid rgba(13,148,136,0.3); }
.type-card .glow {
  position: absolute; top: -25px; right: -25px;
  width: 90px; height: 90px; border-radius: 50%; pointer-events: none;
}
.card-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.card-icon.purple { background: linear-gradient(135deg, #7c3aed, #4c1d95); box-shadow: 0 4px 16px rgba(124,58,237,0.32); }
.card-icon.teal { background: linear-gradient(135deg, #0d9488, #0f766e); box-shadow: 0 4px 16px rgba(13,148,136,0.32); }
.card-title { font-size: 18px; font-weight: 700; color: #1e1b4b; margin-bottom: 7px; }
.card-desc { font-size: 13px; color: #7c6fad; line-height: 1.6; margin-bottom: 20px; }
.preview { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
.prev-item {
  display: flex; align-items: center; gap: 7px;
  border-radius: 7px; padding: 6px 9px; font-size: 11px;
}
.prev-item.active-p { background: rgba(139,92,246,0.12); color: #5b21b6; }
.prev-item.inactive { background: rgba(255,255,255,0.55); border: 0.5px solid rgba(139,92,246,0.12); color: #94a3b8; }
.prev-item.active-t { background: rgba(204,251,241,0.4); border: 0.5px solid rgba(13,148,136,0.18); color: #0f766e; }
.prev-letter {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
}
.btn-start {
  width: 100%; border: none; border-radius: 10px;
  padding: 11px; font-size: 13px; font-weight: 700; color: #fff;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-start:hover { opacity: 0.88; }
.btn-start.purple { background: linear-gradient(135deg, #6d28d9, #4c1d95); box-shadow: 0 2px 12px rgba(109,40,217,0.25); }
.btn-start.teal { background: linear-gradient(135deg, #0d9488, #0f766e); box-shadow: 0 2px 12px rgba(13,148,136,0.25); }
.count-row { display: flex; align-items: center; gap: 12px; }
.count-row span { font-size: 13px; color: #7c6fad; }
.count-opts { display: flex; gap: 8px; }
.count-pill {
  border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer;
  border: 0.5px solid rgba(139,92,246,0.15); transition: all 0.15s;
  background: rgba(255,255,255,0.55); color: #94a3b8;
}
.count-pill.selected { background: linear-gradient(90deg,rgba(139,92,246,0.2),rgba(109,40,217,0.12)); color: #4c1d95; font-weight: 600; border-color: rgba(139,92,246,0.3); }
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#e9d5ff" stroke-width="2"/>
        <path d="M2 17l10 5 10-5" stroke="#5eead4" stroke-width="2"/>
        <path d="M2 12l10 5 10-5" stroke="#c4b5fd" stroke-width="2"/>
      </svg>
    </div>
    <div>
      <div style="font-size:14px;font-weight:700;letter-spacing:-0.3px;"><span style="color:#c4b5fd;">Vo</span><span style="color:#5eead4;">ca</span><span style="color:#a78bfa;">S</span></div>
      <div style="font-size:9px;color:#334155;letter-spacing:0.05em;">VOCAB STATS</div>
    </div>
  </div>
  <p class="sb-sec">VOCA</p>
  <a href="wordbook.html" class="sb-item">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    단어장
  </a>
  <a href="test.html" class="sb-item active">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    테스트
  </a>
  <div class="sb-bottom">
    <a href="profile.html" class="sb-avatar">
      <div class="sb-avatar-img">지우</div>
      <span style="font-size:12px;color:#475569;">내 계정</span>
    </a>
  </div>
</nav>

<main class="main">
  <p class="eyebrow">테스트 시작</p>
  <h1>어떤 방식으로 학습할까요?</h1>
  <p class="sub">유형을 선택하면 바로 테스트가 시작됩니다</p>

  <div class="cards">
    <!-- 객관식 -->
    <a href="test-multiple.html" class="type-card purple">
      <div class="glow" style="background:radial-gradient(circle,rgba(167,139,250,0.25) 0%,transparent 70%);"></div>
      <div class="card-icon purple">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="9 11 12 14 22 4"/></svg>
      </div>
      <p class="card-title">객관식</p>
      <p class="card-desc">4개의 보기 중에서<br>정답을 선택하세요</p>
      <div class="preview">
        <div class="prev-item active-p">
          <div class="prev-letter" style="background:rgba(139,92,246,0.2);color:#5b21b6;">A</div>
          선택지 1
        </div>
        <div class="prev-item inactive">
          <div class="prev-letter" style="background:rgba(139,92,246,0.07);color:#94a3b8;">B</div>
          선택지 2
        </div>
      </div>
      <button class="btn-start purple">객관식 시작 →</button>
    </a>

    <!-- 주관식 -->
    <a href="test-subjective.html" class="type-card teal">
      <div class="glow" style="background:radial-gradient(circle,rgba(45,212,191,0.2) 0%,transparent 70%);"></div>
      <div class="card-icon teal">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccfbf1" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
      <p class="card-title">주관식</p>
      <p class="card-desc">단어의 뜻을 직접<br>타이핑해서 입력하세요</p>
      <div class="preview">
        <div class="prev-item active-t">직접 입력...</div>
        <div class="prev-item inactive" style="display:flex;align-items:center;gap:5px;">
          <div style="width:6px;height:6px;border-radius:50%;background:#0d9488;opacity:0.4;"></div>
          정답 확인
        </div>
      </div>
      <button class="btn-start teal">주관식 시작 →</button>
    </a>
  </div>

  <div class="count-row">
    <span>문제 수:</span>
    <div class="count-opts">
      <div class="count-pill selected" onclick="selectCount(this)">10문제</div>
      <div class="count-pill" onclick="selectCount(this)">20문제</div>
      <div class="count-pill" onclick="selectCount(this)">전체</div>
    </div>
  </div>
</main>

<script>
function selectCount(el) {
  document.querySelectorAll('.count-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
}
</script>
</body>
</html>
